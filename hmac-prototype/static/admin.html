<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Return Review</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 24px;
      color: #212529;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .subtitle { color: #6c757d; margin-bottom: 24px; }
    .card {
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h3 { margin-top: 0; font-size: 1.1rem; }
    .meta { font-size: 0.9rem; color: #6c757d; margin: 6px 0; }
    .actions { margin-top: 12px; }
    button {
      padding: 8px 16px;
      margin-right: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .approve { background: #198754; color: white; }
    .reject { background: #dc3545; color: white; }
    .login-box {
      max-width: 360px;
      margin: 80px auto;
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 24px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      border: 1px solid #ced4da;
      border-radius: 4px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login (simulated Google-style) -->
    <div id="login-section" class="login-box">
      <h2>Admin Login</h2>
      <p style="color:#6c757d; font-size:0.9rem;">
        Demo credentials (simulating Google login)<br>
        Username: admin &nbsp;|&nbsp; Password: admin123
      </p>
      <label>Username</label>
      <input type="text" id="username" value="admin">
      <label>Password</label>
      <input type="password" id="password" value="admin123">
      <button onclick="login()" style="width:100%; background:#0d6efd; color:white; padding:12px;">
        Sign in
      </button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <h1>Return Review</h1>
      <p class="subtitle">Returns over $100 require manual approval</p>

      <div id="pending-list"></div>
      <p id="empty-msg" class="hidden" style="color:#6c757d;">No pending returns at this time.</p>
    </div>
  </div>

  <script>
    let authHeader = "";

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      authHeader = "Basic " + btoa(user + ":" + pass);

      // Test auth by calling the API
      fetch("/admin/returns", {
        headers: { "Authorization": authHeader }
      })
      .then(r => {
        if (!r.ok) throw new Error("Auth failed");
        return r.json();
      })
      .then(data => {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        render(data);
      })
      .catch(() => alert("Invalid credentials"));
    }

    function render(data) {
      const list = document.getElementById("pending-list");
      const empty = document.getElementById("empty-msg");
      list.innerHTML = "";

      if (!data.pending || data.pending.length === 0) {
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      data.pending.forEach(r => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <h3>Return ${r.id}</h3>
          <div class="meta">Order: ${r.order_id}</div>
          <div class="meta">Value: $${r.value.toFixed(2)}</div>
          <div class="meta">Requested: ${r.requested_at}</div>
          <div class="meta">Reason: ${r.reason}</div>
          <div class="actions">
            <button class="approve" onclick="decide('${r.id}', 'approve')">Approve</button>
            <button class="reject" onclick="decide('${r.id}', 'reject')">Reject</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function decide(id, action) {
      fetch(`/admin/returns/${id}/${action}`, {
        method: "POST",
        headers: { "Authorization": authHeader }
      })
      .then(r => r.json())
      .then(() => {
        // Refresh list
        return fetch("/admin/returns", { headers: { "Authorization": authHeader } });
      })
      .then(r => r.json())
      .then(render)
      .catch(err => alert("Action failed"));
    }
  </script>
</body>
</html>
